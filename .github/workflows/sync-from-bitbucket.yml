name: Sync from Bitbucket

on:
  # Trigger the sync manually from the Actions tab whenever you choose
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout GitHub Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Fetches full history so git merge works properly

      # Optional SSH Setup: Configures SSH ONLY if BITBUCKET_SSH_KEY secret exists
      - name: Set up SSH key (for private Bitbucket repos)
        if: ${{ secrets.BITBUCKET_SSH_KEY != '' }}
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.BITBUCKET_SSH_KEY }}

      - name: Sync Code from Bitbucket
        run: |
          # 1. Configure git bot identity
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BITBUCKET_URL="https://bitbucket.org/rsvaliveti/zola.git"
          
          # 2. Add Bitbucket as remote and fetch commits
          git remote add bitbucket "$BITBUCKET_URL"
          git fetch bitbucket

          # 3. Force GitHub main branch to match Bitbucket main branch exactly
          git checkout main
          git reset --hard bitbucket/main
          git push origin main --force