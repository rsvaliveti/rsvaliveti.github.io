name: Build and deploy site

on:
  push:
    # Only deploy when a commit is pushed with a version tag of the form
    # v<up to 3 period-separated numbers>: v1, v1.2, v1.2.3 (multi-digit ok).
    tags:
      - 'v[0-9]+'
      - 'v[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    env:
      ZOLA_VERSION: "0.22.0"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # 1. Compile Typst CV to static/ folder
      - name: Setup Typst
        uses: typst-community/setup-typst@v5
        with:
          typst-version: ^0.15.0

      - name: Build CV PDF
        run: |
          typst compile --root . typst/cv.typ static/cv/cv.pdf

      # 2. Build Zola Site
      - name: Install Zola
        run: |
          curl -sL "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz" | tar xz
          sudo mv zola /usr/local/bin/
          zola --version

      - name: Build
        run: zola build

      # 3. Deploy to Github Pages branch
      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          force_orphan: true # Keep only 1 commit on gh-pages
